name: Idea
description: Suggest a feature
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Ohmega to do?
      description: What would you use it for, and how do you do it today?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform you use
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
